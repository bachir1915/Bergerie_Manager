<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Connexion — Bergerie Al-Baraka</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.12) 0%, transparent 50%),
                        radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
                        #0b0d10;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 1rem;
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            background: rgba(23, 28, 38, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }
        .login-icon {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(5, 150, 105, 0.2));
            border: 1px solid rgba(16, 185, 129, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            margin: 0 auto 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.3);
        }
        .input-group {
            background-color: #11141a;
            border: 1px solid #242b38;
            border-radius: 12px;
            transition: all 0.2s ease;
            overflow: hidden;
        }
        .input-group:focus-within {
            border-color: #10b981;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
        }
        .input-group-text {
            background-color: transparent !important;
            border: none !important;
            color: #10b981 !important;
            padding-left: 1.25rem;
            padding-right: 0.75rem;
        }
        .input-group-text-btn {
            background-color: transparent !important;
            border: none !important;
            color: #9ca3af !important;
            cursor: pointer;
            padding-right: 1.25rem;
            transition: color 0.2s;
        }
        .input-group-text-btn:hover {
            color: #f3f4f6 !important;
        }
        .form-control-dark {
            background-color: transparent !important;
            border: none !important;
            color: #f3f4f6 !important;
            padding: 0.85rem 1rem 0.85rem 0.25rem !important;
            font-size: 0.95rem;
            box-shadow: none !important;
        }
        .form-control-dark::placeholder {
            color: #4b5563;
        }
        .btn-submit {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            border: none;
            padding: 0.85rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }
        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
            color: #ffffff;
        }
        .btn-submit:active {
            transform: translateY(0);
        }
        .demo-box {
            background: rgba(17, 20, 26, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 1.25rem;
            margin-top: 2rem;
        }
        .btn-demo-eleveur {
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 8px;
            padding: 0.4rem 0.85rem;
            font-weight: 500;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }
        .btn-demo-eleveur:hover {
            background: rgba(16, 185, 129, 0.2);
            border-color: #10b981;
            color: #34d399;
        }
        .btn-demo-vet {
            background: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.25);
            border-radius: 8px;
            padding: 0.4rem 0.85rem;
            font-weight: 500;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }
        .btn-demo-vet:hover {
            background: rgba(59, 130, 246, 0.2);
            border-color: #3b82f6;
            color: #60a5fa;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-icon">🐑</div>
    <h2 class="text-center fw-bold text-white mb-2" style="letter-spacing: -0.5px;">Bergerie Al-Baraka</h2>
    <p class="text-center text-secondary mb-4" style="font-size:0.9rem;">
        Système de Gestion Intelligente d'Élevage
    </p>

    <!-- Erreur -->
    <div th:if="${param.error}" class="alert-flash alert-flash-danger mb-4">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        Email ou mot de passe incorrect.
    </div>
    <!-- Déconnexion -->
    <div th:if="${param.logout}" class="alert-flash alert-flash-success mb-4">
        <i class="bi bi-check-circle-fill me-2"></i>
        Déconnexion réussie.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label text-secondary small fw-medium mb-2">Adresse email</label>
            <div class="input-group">
                <span class="input-group-text">
                    <i class="bi bi-envelope"></i>
                </span>
                <input type="email" name="username" class="form-control form-control-dark"
                       placeholder="email@bergerie.dz" required autofocus
                       id="emailInput"/>
            </div>
        </div>
        <div class="mb-4">
            <label class="form-label text-secondary small fw-medium mb-2">Mot de passe</label>
            <div class="input-group">
                <span class="input-group-text">
                    <i class="bi bi-lock"></i>
                </span>
                <input type="password" name="password" class="form-control form-control-dark"
                       placeholder="••••••••" required id="passwordInput"/>
                <button type="button" class="input-group-text-btn" onclick="togglePwd()">
                    <i class="bi bi-eye" id="eyeIcon"></i>
                </button>
            </div>
        </div>
        <button type="submit" class="btn btn-submit w-100">
            <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
        </button>
    </form>

    <!-- Comptes démo -->
    <div class="demo-box">
        <div class="text-secondary fw-semibold mb-2" style="font-size: 0.8rem; letter-spacing: 0.3px;">
            <i class="bi bi-info-circle me-1 text-accent"></i>COMPTES DE DÉMONSTRATION
        </div>
        <div class="d-flex gap-2 flex-wrap mb-2">
            <button class="btn btn-demo-eleveur" onclick="fillDemo('eleveur@bergerie.dz')">
                <i class="bi bi-person me-1"></i>Éleveur
            </button>
            <button class="btn btn-demo-vet" onclick="fillDemo('vet@bergerie.dz')">
                <i class="bi bi-hospital me-1"></i>Vétérinaire
            </button>
        </div>
        <div class="text-secondary" style="font-size:0.75rem;">
            Mot de passe : <code class="text-white">password123</code>
        </div>
    </div>
</div>

<script>
function fillDemo(email) {
    document.getElementById('emailInput').value = email;
    document.getElementById('passwordInput').value = 'password123';
}
function togglePwd() {
    const p = document.getElementById('passwordInput');
    const i = document.getElementById('eyeIcon');
    if (p.type === 'password') { 
        p.type='text'; 
        i.className='bi bi-eye-slash'; 
    } else { 
        p.type='password'; 
        i.className='bi bi-eye'; 
    }
}
</script>
</body>
</html>
