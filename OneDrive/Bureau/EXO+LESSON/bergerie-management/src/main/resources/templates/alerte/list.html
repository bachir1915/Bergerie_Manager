<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Alertes — Bergerie Al-Baraka</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<nav class="navbar navbar-dark fixed-top">
    <div class="d-flex align-items-center gap-3 ms-3">
        <button class="btn btn-sm" id="sidebarToggle"><i class="bi bi-list fs-4"></i></button>
        <span class="navbar-brand mb-0 fw-bold">
            <i class="bi bi-house-heart-fill text-accent me-2"></i>Bergerie Al-Baraka
        </span>
    </div>
    <div class="d-flex align-items-center gap-3 me-3">
        <a th:href="@{/alertes}" class="btn btn-sm btn-outline-warning">
            <i class="bi bi-bell-fill"></i>
        </a>
        <form th:action="@{/logout}" method="post">
            <button class="btn btn-sm btn-outline-danger" type="submit">
                <i class="bi bi-box-arrow-right"></i>
            </button>
        </form>
    </div>
</nav>

<div class="layout-wrapper">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-section">
            <div class="sidebar-label">Navigation</div>
            <a href="/dashboard/eleveur" class="sidebar-link">
                <i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
            <a href="/animaux" class="sidebar-link">
                <i class="bi bi-emoji-smile"></i><span>Animaux</span></a>
            <a href="/alertes" class="sidebar-link active">
                <i class="bi bi-bell"></i><span>Alertes</span></a>
            <a href="/actes-medicaux" class="sidebar-link">
                <i class="bi bi-heart-pulse"></i><span>Actes Médicaux</span></a>
            <a href="/localisation" class="sidebar-link">
                <i class="bi bi-geo-alt"></i><span>Localisation</span></a>
            <a href="/donnees-env" class="sidebar-link">
                <i class="bi bi-thermometer-half"></i><span>Données Env.</span></a>
        </div>
    </aside>

    <main class="main-content" id="mainContent">
        <!-- Flash -->
        <div th:if="${success}" class="alert-flash alert-flash-success">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
        </div>

        <div class="page-header">
            <div>
                <h1 class="page-title">Alertes & Notifications</h1>
                <p class="page-subtitle" th:text="${nonLues} + ' alertes non lues'">0 alertes non lues</p>
            </div>
        </div>

        <!-- Alerts Table / List -->
        <div class="card-dark">
            <div class="table-responsive">
                <table class="table-dark-custom">
                    <thead>
                        <tr>
                            <th>Date / Heure</th>
                            <th>Niveau</th>
                            <th>Type</th>
                            <th>Animal / Capteur</th>
                            <th>Message</th>
                            <th>Statut</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${alertes == null || #lists.isEmpty(alertes)}">
                            <td colspan="7" class="text-center text-muted py-4">
                                <i class="bi bi-bell-slash fs-2 d-block mb-2"></i>Aucune alerte reçue.
                            </td>
                        </tr>
                        <tr th:each="al : ${alertes}">
                            <td th:text="${al.dateAlerte != null ? #temporals.format(al.dateAlerte,'dd/MM/yyyy HH:mm') : 'N/A'}">Date</td>
                            <td>
                                <span class="badge-sante"
                                      th:classappend="${al.niveau.name() == 'CRITIQUE'} ? 'sante-critique' :
                                                       (${al.niveau.name() == 'GRAVE'} ? 'sante-malade' :
                                                       (${al.niveau.name() == 'MOYEN'} ? 'sante-observation' : 'sante-bon'))"
                                      th:text="${al.niveau}">CRITIQUE</span>
                            </td>
                            <td th:text="${al.type}">VOL</td>
                            <td>
                                <span th:if="${al.animal != null}">
                                    <a th:href="@{'/animaux/' + ${al.animal.id}}" class="text-accent text-decoration-none">
                                        <i class="bi bi-emoji-smile me-1"></i><span th:text="${al.animal.nom}">Animal</span>
                                    </a>
                                </span>
                                <span th:if="${al.capteur != null}" class="text-muted d-block small" th:text="'Capteur: ' + ${al.capteur.reference}"></span>
                            </td>
                            <td th:text="${al.message}">Message d'alerte</td>
                            <td>
                                <span class="badge-sante"
                                      th:classappend="${al.statut.name() == 'NON_LUE'} ? 'sante-critique' :
                                                       (${al.statut.name() == 'LUE'} ? 'sante-observation' : 'sante-bon')"
                                      th:text="${al.statut}">NON_LUE</span>
                            </td>
                            <td>
                                <div class="d-flex gap-2">
                                    <form th:if="${al.statut.name() == 'NON_LUE'}" th:action="@{'/alertes/marquer-lue/' + ${al.id}}" method="post" style="display:inline">
                                        <button type="submit" class="btn btn-sm btn-outline-warning">Marquer lue</button>
                                    </form>
                                    <form th:if="${al.statut.name() != 'TRAITEE'}" th:action="@{'/alertes/marquer-traitee/' + ${al.id}}" method="post" style="display:inline">
                                        <button type="submit" class="btn btn-sm btn-outline-success">Marquer traitée</button>
                                    </form>
                                    <span th:if="${al.statut.name() == 'TRAITEE'}" class="text-muted small"><i class="bi bi-check-lg text-success"></i> Traitée</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('sidebarToggle').addEventListener('click', function() {
        document.getElementById('sidebar').classList.toggle('collapsed');
        document.getElementById('mainContent').classList.toggle('expanded');
    });
</script>
</body>
</html>
