<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Saisie Acte Médical — Bergerie Al-Baraka</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<nav class="navbar navbar-dark fixed-top">
    <div class="d-flex align-items-center gap-3 ms-3">
        <button class="btn btn-sm" id="sidebarToggle"><i class="bi bi-list fs-4"></i></button>
        <span class="navbar-brand mb-0 fw-bold">
            <i class="bi bi-house-heart-fill text-accent me-2"></i>Bergerie Al-Baraka
        </span>
    </div>
    <div class="d-flex align-items-center gap-3 me-3">
        <a th:href="@{/alertes}" class="btn btn-sm btn-outline-warning">
            <i class="bi bi-bell-fill"></i>
        </a>
        <form th:action="@{/logout}" method="post">
            <button class="btn btn-sm btn-outline-danger" type="submit">
                <i class="bi bi-box-arrow-right"></i>
            </button>
        </form>
    </div>
</nav>

<div class="layout-wrapper">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-section">
            <div class="sidebar-label">Navigation</div>
            <a href="/dashboard/veterinaire" class="sidebar-link">
                <i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
            <a href="/animaux" class="sidebar-link">
                <i class="bi bi-emoji-smile"></i><span>Animaux</span></a>
            <a href="/alertes" class="sidebar-link">
                <i class="bi bi-bell"></i><span>Alertes</span></a>
            <a href="/actes-medicaux" class="sidebar-link active">
                <i class="bi bi-heart-pulse"></i><span>Actes Médicaux</span></a>
            <a href="/localisation" class="sidebar-link">
                <i class="bi bi-geo-alt"></i><span>Localisation</span></a>
            <a href="/donnees-env" class="sidebar-link">
                <i class="bi bi-thermometer-half"></i><span>Données Env.</span></a>
        </div>
    </aside>

    <main class="main-content" id="mainContent">
        <div class="page-header">
            <div>
                <a href="/actes-medicaux" class="text-accent text-decoration-none small d-block mb-2">
                    <i class="bi bi-arrow-left"></i> Annuler et retourner
                </a>
                <h1 class="page-title">Saisir un Acte Médical</h1>
                <p class="page-subtitle">Enregistrement d'un soin, traitement ou consultation</p>
            </div>
        </div>

        <div class="card-dark" style="max-width: 600px;">
            <form th:action="@{/actes-medicaux/nouveau}" th:object="${acte}" method="post">
                
                <!-- Animal Selection -->
                <div class="mb-3">
                    <label class="form-label text-muted small">Animal *</label>
                    <select name="animalId" class="form-select-dark w-100" required>
                        <option value="">-- Choisir un animal --</option>
                        <option th:each="a : ${animaux}"
                                th:value="${a.id}"
                                th:text="${a.nom} + ' (' + ${a.race} + ' - Puce: ' + ${a.numeroPuce} + ')'"
                                th:selected="${a.id == selectedAnimalId}"></option>
                    </select>
                </div>

                <!-- Type Soin -->
                <div class="mb-3">
                    <label class="form-label text-muted small">Type de soin *</label>
                    <select th:field="*{typeSoin}" class="form-select-dark w-100" required>
                        <option value="">-- Sélectionner le soin --</option>
                        <option th:each="t : ${typesSoin}" th:value="${t}" th:text="${t}"></option>
                    </select>
                </div>

                <!-- Date Acte -->
                <div class="mb-3">
                    <label class="form-label text-muted small">Date de l'acte *</label>
                    <input type="date" th:field="*{dateActe}" class="form-control-dark-inline w-100" required/>
                </div>

                <!-- Date Rappel (optional) -->
                <div class="mb-3">
                    <label class="form-label text-muted small">Date de rappel (optionnel)</label>
                    <input type="date" th:field="*{dateRappel}" class="form-control-dark-inline w-100"/>
                </div>

                <!-- Observations -->
                <div class="mb-4">
                    <label class="form-label text-muted small">Observations / Diagnostic / Traitement prescrit</label>
                    <textarea th:field="*{observations}" rows="4" class="form-control-dark-inline w-100" placeholder="Ex: Administration vaccin de rappel, à surveiller pendant 48h..."></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn-primary-custom">
                        <i class="bi bi-check-lg me-2"></i>Enregistrer l'acte
                    </button>
                    <a href="/actes-medicaux" class="btn btn-outline-secondary">Annuler</a>
                </div>
            </form>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('sidebarToggle').addEventListener('click', function() {
        document.getElementById('sidebar').classList.toggle('collapsed');
        document.getElementById('mainContent').classList.toggle('expanded');
    });
    // Set default date to today
    document.addEventListener("DOMContentLoaded", function() {
        const dateInput = document.querySelector('input[type="date"]');
        if (dateInput && !dateInput.value) {
            const today = new Date().toISOString().split('T')[0];
            dateInput.value = today;
        }
    });
</script>
</body>
</html>
