<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Animaux — Bergerie Al-Baraka</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<nav class="navbar navbar-dark fixed-top">
    <div class="d-flex align-items-center gap-3 ms-3">
        <button class="btn btn-sm" id="sidebarToggle"><i class="bi bi-list fs-4"></i></button>
        <span class="navbar-brand mb-0 fw-bold">
            <i class="bi bi-house-heart-fill text-accent me-2"></i>Bergerie Al-Baraka
        </span>
    </div>
    <div class="d-flex align-items-center gap-3 me-3">
        <a th:href="@{/alertes}" class="btn btn-sm btn-outline-warning">
            <i class="bi bi-bell-fill"></i>
        </a>
        <form th:action="@{/logout}" method="post">
            <button class="btn btn-sm btn-outline-danger" type="submit">
                <i class="bi bi-box-arrow-right"></i>
            </button>
        </form>
    </div>
</nav>

<div class="layout-wrapper">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-section">
            <div class="sidebar-label">Navigation</div>
            <a href="/dashboard/eleveur" class="sidebar-link">
                <i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
            <a href="/animaux" class="sidebar-link active">
                <i class="bi bi-emoji-smile"></i><span>Animaux</span></a>
            <a href="/alertes" class="sidebar-link">
                <i class="bi bi-bell"></i><span>Alertes</span></a>
            <a href="/actes-medicaux" class="sidebar-link">
                <i class="bi bi-heart-pulse"></i><span>Actes Médicaux</span></a>
            <a href="/localisation" class="sidebar-link">
                <i class="bi bi-geo-alt"></i><span>Localisation</span></a>
            <a href="/donnees-env" class="sidebar-link">
                <i class="bi bi-thermometer-half"></i><span>Données Env.</span></a>
        </div>
    </aside>

    <main class="main-content" id="mainContent">
        <!-- Flash -->
        <div th:if="${success}" class="alert-flash alert-flash-success">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
        </div>

        <div class="page-header">
            <div>
                <h1 class="page-title">Gestion des Animaux</h1>
                <p class="page-subtitle" th:text="${animaux.size()} + ' animal(s) dans le troupeau'">0 animaux</p>
            </div>
            <a th:href="@{/animaux/nouveau}" class="btn-primary-custom">
                <i class="bi bi-plus-lg me-2"></i>Ajouter un Animal
            </a>
        </div>

        <!-- Search/Filter -->
        <div class="card-dark mb-4">
            <div class="d-flex gap-3 flex-wrap align-items-center">
                <input type="text" id="searchInput" class="form-control-dark-inline"
                       placeholder="🔍 Rechercher par nom, race..."/>
                <select id="filterSante" class="form-select-dark">
                    <option value="">Tous les statuts santé</option>
                    <option th:each="s : ${statutsSante}" th:value="${s}" th:text="${s}"></option>
                </select>
            </div>
        </div>

        <!-- Table -->
        <div class="card-dark">
            <div class="table-responsive">
                <table class="table-dark-custom" id="animauxTable">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Nom</th>
                            <th>Race</th>
                            <th>Sexe</th>
                            <th>Poids</th>
                            <th>Naissance</th>
                            <th>Santé</th>
                            <th>Statut</th>
                            <th>Puce</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${animaux == null || #lists.isEmpty(animaux)}">
                            <td colspan="10" class="text-center text-muted py-4">
                                <i class="bi bi-inbox fs-2 d-block mb-2"></i>Aucun animal enregistré
                            </td>
                        </tr>
                        <tr th:each="animal : ${animaux}" class="animal-row"
                            th:attr="data-nom=${animal.nom},data-race=${animal.race},data-sante=${animal.statutSante}">
                            <td th:text="${animal.id}">1</td>
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <div class="animal-avatar">
                                        <span th:text="${#strings.substring(animal.nom,0,1)}">A</span>
                                    </div>
                                    <strong th:text="${animal.nom}">Nom</strong>
                                </div>
                            </td>
                            <td th:text="${animal.race}">Race</td>
                            <td>
                                <span th:text="${animal.sexe == 'M' ? '♂' : '♀'}"
                                      th:classappend="${animal.sexe == 'M'} ? 'text-info' : 'text-pink'"></span>
                                <span th:text="${animal.sexe}"></span>
                            </td>
                            <td th:text="${animal.poids != null ? animal.poids + ' kg' : 'N/A'}">45 kg</td>
                            <td th:text="${animal.dateNaissance != null ? #temporals.format(animal.dateNaissance,'dd/MM/yyyy') : 'N/A'}">Date</td>
                            <td>
                                <span class="badge-sante"
                                      th:classappend="${animal.statutSante.name() == 'BON'} ? 'sante-bon' :
                                                       (${animal.statutSante.name() == 'MALADE'} ? 'sante-malade' :
                                                       (${animal.statutSante.name() == 'CRITIQUE'} ? 'sante-critique' : 'sante-observation'))"
                                      th:text="${animal.statutSante}">SANTE</span>
                            </td>
                            <td>
                                <span class="badge-sante"
                                      th:classappend="${animal.statut.name() == 'ACTIF'} ? 'sante-bon' : 'sante-observation'"
                                      th:text="${animal.statut}">STATUT</span>
                            </td>
                            <td><code th:text="${animal.numeroPuce}">PUCE</code></td>
                            <td>
                                <div class="d-flex gap-1">
                                    <a th:href="@{'/animaux/' + ${animal.id}}"
                                       class="btn-action btn-action-info" title="Détail">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <a th:href="@{'/animaux/modifier/' + ${animal.id}}"
                                       class="btn-action btn-action-warning" title="Modifier">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <a th:href="@{'/actes-medicaux/animal/' + ${animal.id}}"
                                       class="btn-action btn-action-green" title="Actes médicaux">
                                        <i class="bi bi-heart-pulse"></i>
                                    </a>
                                    <form th:action="@{'/animaux/supprimer/' + ${animal.id}}"
                                          method="post" style="display:inline"
                                          onsubmit="return confirm('Supprimer cet animal ?')">
                                        <button type="submit" class="btn-action btn-action-danger" title="Supprimer">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Sidebar
    document.getElementById('sidebarToggle').addEventListener('click', function() {
        document.getElementById('sidebar').classList.toggle('collapsed');
        document.getElementById('mainContent').classList.toggle('expanded');
    });

    // Search & Filter
    function filterTable() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const filterSante = document.getElementById('filterSante').value;
        const rows = document.querySelectorAll('.animal-row');
        rows.forEach(row => {
            const nom = row.getAttribute('data-nom').toLowerCase();
            const race = row.getAttribute('data-race').toLowerCase();
            const sante = row.getAttribute('data-sante');
            const matchSearch = nom.includes(search) || race.includes(search);
            const matchSante = !filterSante || sante === filterSante;
            row.style.display = (matchSearch && matchSante) ? '' : 'none';
        });
    }
    document.getElementById('searchInput').addEventListener('input', filterTable);
    document.getElementById('filterSante').addEventListener('change', filterTable);

    // Flash message
    const flash = document.querySelector('.alert-flash');
    if (flash) setTimeout(() => flash.style.opacity = '0', 3500);
</script>
</body>
</html>
