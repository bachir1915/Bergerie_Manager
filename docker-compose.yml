services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bergerie_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bergerie_db"]
      interval: 5s
      retries: 10

  ml:
    build: ./ml-service
    ports:
      - "8001:8001"

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/bergerie_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      ML_SERVICE_URL: http://ml:8001
    ports:
      - "${BACKEND_PORT:-8085}:8085"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  pgdata:
