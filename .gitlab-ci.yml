stages: [test, build]

backend-test:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script: mvn -B test
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/*.xml

ml-test:
  stage: test
  image: python:3.12-slim
  script:
    - cd ml-service
    - pip install -q -r requirements.txt
    - python train_model.py
    - pytest -q

frontend-build:
  stage: test
  image: node:22-alpine
  script:
    - cd frontend
    - npm ci
    - npm run build

docker-build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA .
    - docker build -t $CI_REGISTRY_IMAGE/ml:$CI_COMMIT_SHORT_SHA ml-service
    - docker build -t $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA frontend
    - docker push --all-tags $CI_REGISTRY_IMAGE/backend
    - docker push --all-tags $CI_REGISTRY_IMAGE/ml
    - docker push --all-tags $CI_REGISTRY_IMAGE/frontend
