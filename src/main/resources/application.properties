# ============================================================
# Application Properties — Bergerie Management System
# ============================================================

spring.application.name=bergerie-management

# ---- PROFILE : utiliser "dev" pour H2, "prod" pour PostgreSQL ----
spring.profiles.active=dev

server.port=8085

# ---- Upload des justificatifs vétérinaires ----
app.justificatifs.dir=uploads/justificatifs
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---- Microservice Python (FastAPI / Isolation Forest) ----
ml.service.url=http://localhost:8001
ml.analysis.cron=0 0 * * * *
ml.scheduler.enabled=true

# ---- Simulation IoT (Capteurs GPS + DHT22/MQ-135) ----
simulation.iot.enabled=true
simulation.iot.gps-delay=15000
simulation.iot.env-delay=30000

