<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle != null ? pageTitle + ' — Bergerie Al-Baraka' : 'Bergerie Al-Baraka'}">Bergerie</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <!-- App CSS -->
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <th:block th:replace="${extraHead}"></th:block>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark fixed-top">
    <div class="d-flex align-items-center gap-3 ms-3">
        <button class="sidebar-toggle btn btn-sm" id="sidebarToggle">
            <i class="bi bi-list fs-4"></i>
        </button>
        <span class="navbar-brand mb-0 fw-bold">
            <i class="bi bi-house-heart-fill text-accent me-2"></i>Bergerie Al-Baraka
        </span>
    </div>
    <div class="d-flex align-items-center gap-3 me-3">
        <a th:href="@{/alertes}" class="btn btn-sm btn-outline-warning position-relative">
            <i class="bi bi-bell-fill"></i>
        </a>
        <div class="dropdown">
            <button class="btn btn-sm btn-outline-light dropdown-toggle" data-bs-toggle="dropdown">
                <i class="bi bi-person-circle me-1"></i>
                <span sec:authentication="name">Utilisateur</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end dropdown-dark">
                <li>
                    <form th:action="@{/logout}" method="post">
                        <button class="dropdown-item text-danger" type="submit">
                            <i class="bi bi-box-arrow-right me-2"></i>Déconnexion
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- SIDEBAR + CONTENT WRAPPER -->
<div class="layout-wrapper">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-section">
            <div class="sidebar-label">Navigation</div>

            <!-- Dashboard -->
            <a th:href="@{/dashboard/eleveur}" sec:authorize="hasRole('ELEVEUR')"
               class="sidebar-link" th:classappend="${currentPage == 'dashboard'} ? 'active' : ''">
                <i class="bi bi-speedometer2"></i><span>Dashboard</span>
            </a>
            <a th:href="@{/dashboard/veterinaire}" sec:authorize="hasRole('VETERINAIRE')"
               class="sidebar-link" th:classappend="${currentPage == 'dashboard'} ? 'active' : ''">
                <i class="bi bi-speedometer2"></i><span>Dashboard</span>
            </a>

            <!-- Animaux -->
            <a th:href="@{/animaux}" class="sidebar-link"
               th:classappend="${currentPage == 'animaux'} ? 'active' : ''">
                <i class="bi bi-emoji-smile"></i><span>Animaux</span>
            </a>

            <!-- Alertes -->
            <a th:href="@{/alertes}" class="sidebar-link"
               th:classappend="${currentPage == 'alertes'} ? 'active' : ''">
                <i class="bi bi-bell"></i><span>Alertes</span>
            </a>

            <!-- Actes Médicaux -->
            <a th:href="@{/actes-medicaux}" class="sidebar-link"
               th:classappend="${currentPage == 'actes'} ? 'active' : ''">
                <i class="bi bi-heart-pulse"></i><span>Actes Médicaux</span>
            </a>

            <!-- Localisation -->
            <a th:href="@{/localisation}" class="sidebar-link"
               th:classappend="${currentPage == 'localisation'} ? 'active' : ''">
                <i class="bi bi-geo-alt"></i><span>Localisation</span>
            </a>

            <!-- Données Env -->
            <a th:href="@{/donnees-env}" class="sidebar-link"
               th:classappend="${currentPage == 'donnees'} ? 'active' : ''">
                <i class="bi bi-thermometer-half"></i><span>Données Env.</span>
            </a>

            <!-- Zones -->
            <a th:href="@{/zones}" class="sidebar-link"
               th:classappend="${currentPage == 'zones'} ? 'active' : ''">
                <i class="bi bi-geo"></i><span>Zones d'Élevage</span>
            </a>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content" id="mainContent">
        <!-- Flash messages -->
        <div th:if="${success}" class="alert-flash alert-flash-success" id="flashMsg">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="alert-flash alert-flash-danger" id="flashMsg">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${error}"></span>
        </div>

        <!-- Page content slot -->
        <th:block th:replace="${content}"></th:block>
    </main>
</div>

<!-- Bootstrap JS (CDN) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Sidebar toggle
    document.getElementById('sidebarToggle').addEventListener('click', function() {
        document.getElementById('sidebar').classList.toggle('collapsed');
        document.getElementById('mainContent').classList.toggle('expanded');
    });
    // Auto-hide flash messages
    const flash = document.getElementById('flashMsg');
    if (flash) setTimeout(() => flash.style.opacity = '0', 3500);
</script>
<th:block th:replace="${extraScripts}"></th:block>
</body>
</html>
